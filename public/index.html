<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisBoard · 知识库 AI 家教</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <script src="/vendor/katex/katex.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234d9fff'/%3E%3Cpath d='M8 11h16M8 16h10M8 21h13' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <a class="brand" href="/" data-route>
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="url(#bg)"/><path d="M8 11h16M8 16h10M8 21h13" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><defs><linearGradient id="bg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#4d9fff"/><stop offset="1" stop-color="#56d4dd"/></linearGradient></defs></svg>
        </span>
        <span class="brand-text">VisBoard<small>知识库 AI 家教</small></span>
      </a>
      <button class="icon-btn collapse-btn" id="collapseBtn" title="收起侧边栏" aria-label="收起侧边栏">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <nav class="side-nav" id="sideNav">
      <a href="/" data-route class="nav-item" data-page="home">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6h-4v6H5a1 1 0 01-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>首页</span>
      </a>
      <a href="/kb" data-route class="nav-item" data-page="kb">
        <svg viewBox="0 0 24 24"><path d="M4 7c0-1.5 3.6-3 8-3s8 1.5 8 3-3.6 3-8 3-8-1.5-8-3zM4 7v10c0 1.5 3.6 3 8 3s8-1.5 8-3V7M4 12c0 1.5 3.6 3 8 3s8-1.5 8-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>知识库</span>
      </a>
      <a href="/prepare" data-route class="nav-item" data-page="prepare">
        <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1zM8 9h6M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>AI 备课</span>
      </a>
      <a href="/board" data-route class="nav-item" data-page="board">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 8h7M7 11h4M12 17l-2 3M12 17l2 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>白板讲解</span>
      </a>
      <a href="/review" data-route class="nav-item" data-page="review">
        <svg viewBox="0 0 24 24"><path d="M9 4h6a1 1 0 011 1v1H8V5a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 6H6a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1V7a1 1 0 00-1-1h-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>笔记小测</span>
      </a>
      <a href="/settings" data-route class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>设置</span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="conn" id="connState"><span class="dot"></span><span class="conn-text">连接中…</span></div>
      <div class="model-chip" id="modelChip">—</div>
    </div>
  </aside>

  <div class="app-main">
    <header class="mobile-bar">
      <button class="icon-btn" id="menuBtn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="mobile-title" id="mobileTitle">VisBoard</span>
    </header>
    <main id="view" class="view"></main>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
